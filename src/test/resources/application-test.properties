# Test Configuration for Smart Expense Tracker
# This profile uses H2 in-memory database for fast unit testing

# Application Settings
spring.application.name=expense-api-test
server.port=8080

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging tests if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Disable validation during DDL
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Logging Configuration for Tests
logging.level.com.yourapp.expensetracker=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration for Testing
spring.security.user.name=testuser
spring.security.user.password=testpass
spring.security.user.roles=USER

# Event-driven publishing disabled for fast, broker-less unit tests.
# The publish->consume->alert path is covered separately by a Testcontainers test.
app.events.enabled=false
