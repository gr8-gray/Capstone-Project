# Docker Integration Test Configuration
# This profile uses Docker MySQL for end-to-end integration testing
# Run with: mvn test -Dspring.profiles.active=docker

# Application Settings
spring.application.name=expense-api-docker-test
server.port=8080

# Docker MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/expense_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=expense_user
spring.datasource.password=expense_password

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Configuration for Docker Testing
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Disable validation during DDL
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Logging Configuration for Docker Tests
logging.level.com.yourapp.expensetracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Security Configuration for Testing
spring.security.user.name=testuser
spring.security.user.password=testpass
spring.security.user.roles=USER
