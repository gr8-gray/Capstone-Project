# Application Settings
spring.application.name=expense-api
server.port=8080
server.servlet.context-path=/

# Database Configuration - MySQL
# SECURITY: Use environment variables instead of hardcoded credentials
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:expense_user}
spring.datasource.password=${DB_PASSWORD:expense_password}

# H2 Console (disabled for MySQL)
spring.h2.console.enabled=false
 
# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Validation Configuration
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.validator.autoregister_listeners=false

# Logging Configuration
# SECURITY: Use environment variables for log levels - avoid DEBUG in production
logging.level.com.yourapp.expensetracker=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file configuration
logging.file.name=logs/expense-tracker.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=500MB

# Security Configuration
# SECURITY: Use environment variables for credentials - NEVER hardcode
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:changeme}
spring.security.user.roles=ADMIN

# JWT Configuration
# SECURITY: Use environment variables for JWT secret
app.jwt.secret=${JWT_SECRET:REDACTED}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Jackson Configuration (JSON serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Development Settings
spring.web.resources.add-mappings=true

# CORS Configuration
# SECURITY: Restrict CORS origins in production - avoid wildcard (*)
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Actuator Settings (for health checks and monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# ===================================================================
# EVENT-DRIVEN / KAFKA CONFIGURATION
# ===================================================================
# Master switch for the expense event producer (Spring Integration -> Kafka).
# Disabled in the test profile so unit tests run without a broker.
app.events.enabled=${EVENTS_ENABLED:true}
app.kafka.topic.expenses=${EXPENSES_TOPIC:expenses}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Value serializer is configured programmatically in ExpenseEventIntegrationConfig:
# a JsonSerializer using the app ObjectMapper (ISO-8601 dates) with no type headers,
# so the (Kotlin) consumer receives plain, portable JSON.

# File Upload Settings (for future CSV import/export features)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Internationalization (i18n)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# Profile-specific configurations
# Uncomment and configure for different environments:
# spring.profiles.active=dev

# Production Notes:
# - Change spring.jpa.hibernate.ddl-auto to 'validate' or 'none'
# - Set spring.jpa.show-sql=false
# - Configure proper logging levels
# - Set up environment-specific database credentials
# - Configure SSL/TLS settings
# - Restrict CORS to specific origins