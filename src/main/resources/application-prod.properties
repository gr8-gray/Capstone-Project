# PRODUCTION PROFILE - Override development settings
spring.profiles.active=prod

# Database Configuration - Production
# SECURITY: MUST use environment variables in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration - Production
# SECURITY: Use INFO or WARN level in production - avoid DEBUG
logging.level.com.yourapp.expensetracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Error Handling - Production
# SECURITY: Hide stack traces in production
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=on_param
server.error.include-binding-errors=never

# Actuator Settings - Production
# SECURITY: Restrict actuator endpoints in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# CORS Configuration - Production
# SECURITY: Replace with actual production domain
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type
spring.web.cors.allow-credentials=true
