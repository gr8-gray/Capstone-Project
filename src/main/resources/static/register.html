<!--
  SMART EXPENSE TRACKER – REGISTER (Redesign 2026)
  CMSC 495 – Capstone Project

  JS hooks preserved: #register-form, #first-name, #last-name,
  #username, #email, #password, #confirm-password, #error-message,
  button[type="submit"].
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Smart Expense Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="auth-body">
    <div class="auth-container">
      <div class="auth-brand">SMART EXPENSE TRACKER</div>
      <h1>Create your account</h1>

      <!-- Error Message (auth.js showError target) -->
      <div id="error-message" style="display:none;"></div>

      <form id="register-form">

        <!-- First Name -->
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" placeholder="Enter your first name" required />

        <!-- Last Name -->
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" placeholder="Enter your last name" required />

        <!-- Username -->
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" required />

        <!-- Email -->
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required />

        <!-- Password -->
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required />

        <!-- Confirm Password -->
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm password" required />

        <button type="submit" class="btn-primary">Register</button>

        <p>
          Already have an account?
          <a href="login.html">Login here</a>
        </p>
      </form>
    </div>

    <script src="auth.js"></script>
    <script src="register-script.js"></script>
  </body>
</html>
