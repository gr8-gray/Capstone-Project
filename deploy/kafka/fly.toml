# Fly config — internal-only Kafka (KRaft single broker, no public service).
# Reachable over 6PN at dicks-expense-kafka.internal:9092.
# KEY DETAIL: listeners bind to [::] (IPv6) because Fly's private network is
# IPv6-only. Binding 0.0.0.0 would leave the broker unreachable over 6PN.
# The dual-stack [::] socket still accepts IPv4-mapped (localhost) connections,
# so the controller self-connect via 1@localhost:9093 works.
app = "dicks-expense-kafka"
primary_region = "iad"

[build]
  image = "apache/kafka:3.9.1"

[env]
  KAFKA_NODE_ID = "1"
  KAFKA_PROCESS_ROLES = "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS = "1@localhost:9093"
  KAFKA_LISTENERS = "PLAINTEXT://[::]:9092,CONTROLLER://[::]:9093"
  KAFKA_ADVERTISED_LISTENERS = "PLAINTEXT://dicks-expense-kafka.internal:9092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP = "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES = "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME = "PLAINTEXT"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR = "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR = "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR = "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS = "0"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
