<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Expense Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./style.css">
</head>

<body class="auth-body">

  <div class="auth-container">
    <div class="auth-brand">SMART EXPENSE TRACKER</div>
    <h1>Welcome back</h1>

    <div id="error-message" style="display:none;"></div>

    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>

      <button type="submit" class="btn-primary">Login</button>

      <p>
        Don't have an account?
        <a href="./register.html">Register here</a>
      </p>
      <p>
        <a href="./forgot.html">Forgot password?</a>
      </p>
    </form>
  </div>

  <script src="./auth.js"></script>
  <script src="./login.js"></script>
</body>
</html>
