<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Change Password - Smart Expense Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="./style.css">
</head>
<body class="auth-body">

<div class="panel">
    <div class="auth-brand">SMART EXPENSE TRACKER</div>
    <h2>Change Password</h2>

    <input type="password" id="oldPassword" placeholder="Old password">
    <input type="password" id="newPassword" placeholder="New password">

    <button class="btn-primary" onclick="changePassword()">Update Password</button>

    <p id="msg"></p>

    <a href="dashboard.html">&larr; Back to Dashboard</a>
</div>

<script>
async function changePassword() {
    const oldPassword = document.getElementById("oldPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    const msg = document.getElementById("msg");

    msg.innerText = "";

    const token = localStorage.getItem("token");

    const res = await fetch("http://localhost:8080/api/auth/change-password", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ oldPassword, newPassword })
    });

    const data = await res.json();

    if (res.ok) {
        msg.style.color = "var(--emerald)";
        msg.innerText = "Password updated successfully!";
    } else {
        msg.style.color = "var(--rose)";
        msg.innerText = data.error || "Error updating password";
    }
}
</script>

</body>
</html>
