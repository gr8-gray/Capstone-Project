<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .reset-container {
        background: white;
        width: 350px;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .reset-container h2 {
        margin-bottom: 20px;
        color: #333;
        font-size: 22px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    .btn {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn:hover {
        background-color: #0056cc;
    }

    .message {
        margin-top: 15px;
        font-size: 14px;
        font-weight: bold;
    }

    .message.success { color: green; }
    .message.error { color: red; }

    a {
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: #007bff;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="reset-container">
    <h2>Forgot Password</h2>

    <!-- STEP 1: Enter Email -->
    <div id="step1">
        <input id="emailInput" type="email" placeholder="Enter your email" />
        <button class="btn" onclick="requestSecretQuestion()">Next</button>
        <div id="messageBox" class="message"></div>
    </div>

    <!-- STEP 2: Answer Secret Question + New Password -->
    <div id="step2" style="display:none;">
        <p id="questionBox" style="font-weight:bold;margin-bottom:10px;"></p>

        <input id="secretAnswerInput" type="text" placeholder="Your answer" />
        <input id="newPassInput" type="password" placeholder="New password" />

        <button class="btn" onclick="submitNewPassword()">Reset Password</button>

        <div id="messageBox2" class="message"></div>
    </div>

    <a href="login.html">← Back to Login</a>
</div>

<script src="forgot.js"></script>

</body>
</html>
