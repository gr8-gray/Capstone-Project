<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - Smart Expense Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="./style.css" />
</head>

<body class="auth-body">

<div class="panel">
    <div class="auth-brand">SMART EXPENSE TRACKER</div>
    <h2>Forgot Password</h2>

    <input id="emailInput" type="email" placeholder="Enter your email" />

    <button class="btn-primary" onclick="resetPassword()">Reset Password</button>

    <div id="messageBox" class="message"></div>

    <a href="login.html">&larr; Back to Login</a>
</div>

<script>
async function resetPassword() {
    const email = document.getElementById("emailInput").value.trim();
    const msgBox = document.getElementById("messageBox");

    msgBox.textContent = "";
    msgBox.className = "message";

    if (!email) {
        msgBox.textContent = "Please enter your email.";
        msgBox.classList.add("error");
        return;
    }

    try {
        const response = await fetch(
            "http://localhost:8080/api/auth/reset-password?email=" + encodeURIComponent(email),
            {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            }
        );

        const data = await response.json();

        if (response.ok) {
            msgBox.textContent = data.message;
            msgBox.classList.add("success");
        } else {
            msgBox.textContent = data.error || "Something went wrong.";
            msgBox.classList.add("error");
        }

    } catch (error) {
        msgBox.textContent = "Server error. Try again later.";
        msgBox.classList.add("error");
    }
}
</script>

</body>
</html>
