<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Smart Expense Tracker</title>

    <!-- Link to shared stylesheet for authentication styling -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="auth-body">
    <!-- ================= REGISTRATION PAGE CONTAINER ================= -->
    <div class="auth-container">
      <!-- Page title -->
      <h1>Create Your Account</h1>

      <!-- ===== REGISTRATION FORM ===== -->
      <form id="register-form">
        <!-- Full name input field -->
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          placeholder="Enter your full name" 
          required 
        />

        <!-- Email input field -->
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          placeholder="Enter your email" 
          required 
        />

        <!-- Password creation field -->
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Create a password" 
          required 
        />

        <!-- Confirm password field for validation -->
        <label for="confirm-password">Confirm Password</label>
        <input 
          type="password" 
          id="confirm-password" 
          placeholder="Confirm password" 
          required 
        />

        <!-- Button to submit registration form -->
        <button type="submit" class="btn-primary">Register</button>

        <!-- Redirect link for existing users -->
        <p>
          Already have an account?
          <a href="index.html" class="link-register">Login here</a>
        </p>
      </form>
    </div>
  </body>
</html>
